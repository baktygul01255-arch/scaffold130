<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор урока Scaffold</title>
<style>
[hidden]{display:none!important}
body{margin:0}
/* Layout: left rail of 9 numbered Scaffold steps + working panel; the board view mirrors the physical card layout. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --surface-2:#F6F7F9; --ink:#1A202B; --muted:#5D6574; --line:#D8DCE3;
  --accent:#0C8A87; --accent-ink:#FFFFFF; --accent-soft:#DDF1F0;
  --sticky:#FFF4C2; --sticky-line:#E9D98A; --sticky-ink:#3B3416;
  --dig:#E8502C; --dig2:#F27A1F; --ent:#7E1B83; --ent2:#C3168F; --grn:#1EA772; --grn2:#4DBB4F; --life:#8DBB12; --life2:#B5D41C; --tr:#0FA2A6; --tr2:#2CBF86;
  --ok:#1F8A4C; --warn:#B26B00; --warn-soft:#FFF0D6; --danger:#B42318;
  --f-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --f-body:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --f-mono:Consolas,"Cascadia Mono",ui-monospace,Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161C; --surface:#1A1F27; --surface-2:#20262F; --ink:#E6E9EE; --muted:#9AA2B0; --line:#2E3540;
  --accent:#36C2BD; --accent-ink:#06201F; --accent-soft:#163533;
  --sticky:#3A3420; --sticky-line:#5A4F2A; --sticky-ink:#F3E9BE;
  --ok:#4CC27E; --warn:#F0A940; --warn-soft:#3A2C12; --danger:#F07167;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1A1F27; --surface-2:#20262F; --ink:#E6E9EE; --muted:#9AA2B0; --line:#2E3540;
  --accent:#36C2BD; --accent-ink:#06201F; --accent-soft:#163533;
  --sticky:#3A3420; --sticky-line:#5A4F2A; --sticky-ink:#F3E9BE;
  --ok:#4CC27E; --warn:#F0A940; --warn-soft:#3A2C12; --danger:#F07167;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
/* top bar */
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);z-index:20}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand-mark{display:grid;grid-template-columns:repeat(2,9px);gap:2px}
.brand-mark i{width:9px;height:9px;border-radius:2px;display:block}
.lesson-pick{display:flex;gap:8px;align-items:center;flex:1 1 320px;min-width:0;flex-wrap:wrap}
.lesson-pick select{flex:1 1 200px;min-width:0;max-width:420px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 9px;font-size:13px}
.save-state{font-size:12px;color:var(--muted)}
/* rail */
.rail{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow:auto}
.rail-h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:6px 10px 8px;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.step-btn{width:100%;text-align:left;display:grid;grid-template-columns:30px 1fr 12px;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border:0;background:transparent;cursor:pointer}
.step-btn:hover{background:var(--surface-2)}
.step-btn.on{background:var(--accent-soft)}
.step-num{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--muted);background:var(--surface)}
.step-btn.on .step-num{border-color:var(--accent);color:var(--accent)}
.step-btn.done .step-num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step-t{font-size:14px;font-weight:600;line-height:1.25}
.step-s{display:block;font-size:12px;color:var(--muted);font-weight:400}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)}
.rail-foot{margin-top:14px;padding:12px 10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
/* main */
main{padding-block:24px 64px;padding-inline:28px;min-width:0}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,2.6vw,30px);line-height:1.15}
.lead{color:var(--muted);max-width:70ch;margin:0}
.pcard{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:760px}
.pcard .no{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--accent);line-height:1}
.pcard .lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pcard .q{font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:16px;font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:13.5px}
.note b{color:var(--warn)}
.nav-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:4px}
/* task cards with stickies */
.head-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcard .tt{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.tcard .tq{font-weight:600;line-height:1.35}
.tcard .tn{font-size:12.5px;color:var(--muted)}
.sticky{width:100%;min-height:86px;resize:vertical;border:1px solid var(--sticky-line);background:var(--sticky);color:var(--sticky-ink);border-radius:4px;padding:10px 12px;line-height:1.45;box-shadow:0 2px 0 var(--sticky-line)}
.sticky::placeholder{color:var(--sticky-ink);opacity:.55}
.dur-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dur-row input{width:110px;padding:8px 10px;border:1px solid var(--sticky-line);background:var(--sticky);color:var(--sticky-ink);border-radius:4px;font-family:var(--f-mono)}
.chip-btn{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}
.chip-btn:hover{border-color:var(--accent)}
.chip-btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.input,.area{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.area{min-height:80px;resize:vertical}
/* board */
.board{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.bcol{display:flex;flex-direction:column;gap:8px;min-width:150px}
.bhead{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.bhead:hover{border-color:var(--accent)}
.bhead .n{font-family:var(--f-display);font-weight:700;color:var(--accent);font-size:18px}
.bhead .t{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;line-height:1.25}
.bitem{font-size:12.5px;padding:7px 9px;border-radius:6px;background:var(--surface);border:1px solid var(--line);line-height:1.3}
.bitem.st{background:var(--sticky);border-color:var(--sticky-line);color:var(--sticky-ink)}
.bitem.empty{background:transparent;border-style:dashed;color:var(--muted)}
.bitem .code{font-family:var(--f-mono);font-weight:700;font-size:11px;margin-right:4px}
.tasks-strip{display:flex;flex-wrap:wrap;gap:8px}
.tasks-strip .bitem{max-width:260px}
/* competence library */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .input{max-width:260px}
.fw-chip{display:inline-flex;align-items:center;gap:6px}
.fw-chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sym-row{display:flex;flex-wrap:wrap;gap:6px}
.sym-btn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12.5px;color:var(--ink)}
.sym-btn svg{color:var(--tr)}
.sym-btn.on{border-color:var(--tr);background:var(--accent-soft)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:box-shadow .15s,border-color .15s}
.ccard.sel{border-color:var(--c1);box-shadow:0 0 0 2px var(--c1)}
.ccard.flash{animation:flash 1.2s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:none}}
.cband{background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff;padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-height:92px}
.cband.lite{color:#1C2A05}
.ctop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cname{font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;line-height:1.25}
.ccode{font-family:var(--f-mono);font-weight:700;font-size:13px;white-space:nowrap}
.cfw{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;font-weight:600}
.cbody{padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.cint{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.cint .lab{color:var(--muted);margin-right:2px}
.code-chip{font-family:var(--f-mono);font-size:11.5px;font-weight:700;padding:2px 6px;border-radius:5px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;color:var(--ink)}
.code-chip:hover{border-color:var(--accent)}
.code-chip.hit{background:var(--accent-soft);border-color:var(--accent)}
.csyms{display:flex;gap:4px;color:var(--tr)}
.cdesc{font-size:13.5px}
.chint{font-size:13px;font-style:italic;padding:8px 10px;border-radius:6px;background:var(--surface-2);border-left:3px solid var(--c1)}
.cfoot{padding:0 14px 14px}
.sel-btn{width:100%;justify-content:center}
.ccard.sel .sel-btn{background:var(--c1);border-color:var(--c1);color:#fff}
.ccard.sel.lite .sel-btn{color:#1C2A05}
.tray{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 8px;border-radius:7px;font-size:13px;color:#fff;background:linear-gradient(120deg,var(--c1),var(--c2));max-width:100%}
.tag.lite{color:#1C2A05}
.tag .code{font-family:var(--f-mono);font-weight:700;font-size:12px}
.tag button{border:0;background:rgba(0,0,0,.18);color:inherit;border-radius:5px;width:20px;height:20px;cursor:pointer;line-height:1;display:grid;place-items:center}
.reco{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.reco .code-chip .cnt{font-weight:500;color:var(--muted);margin-left:3px}
.trans-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tl{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--muted)}
.tl svg{flex:none;color:var(--tr);margin-top:2px}
.tl b{color:var(--ink);display:block;font-size:13px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
/* method cards */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.mcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.mhead{padding:14px 16px 10px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.mhead .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mhead h3{font-size:15px;text-transform:uppercase;letter-spacing:.03em;line-height:1.3}
.mbody{padding:12px 16px;display:flex;flex-direction:column;gap:10px;font-size:13.5px;flex:1}
.mbody ol,.mbody ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.mfoot{padding:0 16px 14px;display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);letter-spacing:.03em}
/* lists */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.row .input{flex:1;min-width:0}
.check{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.check input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.check .input{background:transparent;border:0;padding:2px 0}
.check.done .input{text-decoration:line-through;color:var(--muted)}
.icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;width:28px;height:28px;border-radius:6px;flex:none}
.icon-btn:hover{color:var(--danger);background:var(--surface)}
/* timeline */
.tl-wrap{overflow-x:auto}
table.tline{width:100%;border-collapse:separate;border-spacing:0;min-width:1040px}
.tline th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:700}
.tline td{padding:6px 4px;vertical-align:top;border-bottom:1px solid var(--line)}
.tline textarea,.tline input{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px;resize:vertical;min-height:38px;line-height:1.4}
.tline textarea:hover,.tline input:hover,.tline textarea:focus,.tline input:focus{border-color:var(--line);background:var(--surface-2)}
.tline .min{font-family:var(--f-mono);font-variant-numeric:tabular-nums;width:64px}
.tline .clock{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:13px;font-variant-numeric:tabular-nums}
.tbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.tbar span{display:block;height:100%;border-right:1px solid var(--surface)}
.sum{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.pill{font-family:var(--f-mono);font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
/* plan doc */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:22px;max-width:900px}
.doc h2.dt{font-family:var(--f-display);font-size:22px;font-weight:700}
.doc h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700;margin-bottom:8px}
.kv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;white-space:pre-wrap}
.doc table{width:100%;border-collapse:collapse;font-size:13.5px}
.doc table.p130 th{width:22%;text-align:left;font-size:13px}
.appx{border-top:2px solid var(--line);padding-top:18px}
.doc th,.doc td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;white-space:pre-wrap}
.doc th{background:var(--surface-2);font-size:12px}
.doc .tbl{overflow-x:auto}
.empty-v{color:var(--muted);font-style:italic}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:var(--shadow)}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:20px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.modal textarea{min-height:180px;font-family:var(--f-mono);font-size:12px}
.example-flag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}
  .rail-h,.rail-foot{display:none}
  .steps{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .steps li{flex:none}
  .step-btn{grid-template-columns:26px auto;padding:6px 8px}
  .step-btn .dot{display:none}
  .step-num{width:26px;height:26px}
  .step-s{display:none}
  main{padding-inline:16px}
  .top{position:static;padding-inline:16px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{font-weight:600;color:var(--ink);margin-top:6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i style="background:var(--dig)"></i><i style="background:var(--ent2)"></i><i style="background:var(--grn)"></i><i style="background:var(--life)"></i></span>Scaffold · конструктор урока</div>
    <div class="lesson-pick">
      <label for="lessonSel" class="hint">Урок:</label>
      <select id="lessonSel"></select>
      <button class="btn small" id="newBtn" type="button">+ Новый урок</button>
      <button class="btn small ghost" id="dupBtn" type="button">Копия</button>
      <button class="btn small ghost" id="ioBtn" type="button">Резервная копия</button>
      <button class="btn small primary" id="wordTop" type="button">Скачать в Word</button>
      <button class="btn small ghost danger" id="delBtn" type="button">Удалить</button>
    </div>
    <span class="save-state" id="saveState"></span>
  </header>
  <nav class="rail" aria-label="Шаги">

function draftTimeline(){const l=L();
 const proceed=()=>{const dur=parseFloat(l.task.duration)||90;const m=TBY[l.teach.methods[0]];
  const diag=l.diag.methods.map(id=>ABY[id].n).join(", ")||"Диагностика";const asm=l.assess.methods.map(id=>ABY[id].n).join(", ");
  const core=m?m.s:["Постановка задачи","Основная деятельность","Представление результатов"];
  const rows=[{stage:"Начало. Определение начального уровня",teacher:l.diag.note||"Проводит диагностику исходного уровня.",students:"",assess:diag,res:"",w:1.2}];
  core.forEach((s,i)=>rows.push({stage:m?`${m.n.split(" ")[0]}: шаг ${i+1}`:s,teacher:"",students:m?s:"",assess:i===core.length-2?asm:"",res:"",w:i===2||i===3?1.6:1.1}));
  rows.push({stage:"Рефлексия и итоги",teacher:"Подводит итоги по критериям и индикаторам.",students:"Оценивают свой прогресс.",assess:asm||"Самоанализ",res:"",w:1});
  const W=rows.reduce((a,r)=>a+r.w,0);let left=dur;
  l.timeline=rows.map((r,i)=>{let mm=i===rows.length-1?left:Math.max(5,Math.round(dur*r.w/W/5)*5);left-=mm;const{w,...rest}=r;return{min:String(mm),...rest}});
  save();render();toast("Черновик создан — отредактируйте этапы")};
 if(l.timeline.length){confirmBox("Заменить текущую хронологию черновиком? Текущие этапы будут удалены.","Заменить",proceed)}else proceed()}

function confirmBox(msg,yes,fn){const bg=document.createElement("div");bg.className="modal-bg";bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div>${esc(msg)}</div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" data-x>Отмена</button><button type="button" class="btn primary" data-y>${esc(yes)}</button></div></div>`;
 document.body.appendChild(bg);bg.querySelector("[data-y]").focus();bg.addEventListener("click",e=>{if(e.target.closest("[data-y]")){e.stopPropagation();bg.remove();fn()}else if(e.target.closest("[data-x]")||e.target===bg){e.stopPropagation();bg.remove()}})}

async function copyPlan(rich){const html=`<div style="font-family:Arial,sans-serif">${planHTML().replace(/<span class="empty-v">не заполнено<\/span>/g,"—")}</div>`;const txt=planText();
 try{if(rich&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([txt],{type:"text/plain"})})])}else{await navigator.clipboard.writeText(txt)}toast("План скопирован — вставьте его в документ")}
 catch(err){try{await navigator.clipboard.writeText(txt);toast("Скопирован как текст")}catch(e2){const r=document.createRange();r.selectNodeContents($("#doc"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Текст выделен — нажмите Ctrl+C")}}}

function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(files){const enc=new TextEncoder();const parts=[],central=[];let off=0;const d=new Date();
 const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF, dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
 for(const [name,str] of files){const nb=enc.encode(name),data=enc.encode(str),crc=crc32(data);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nb.length,true);h.setUint16(28,0,true);
  parts.push(new Uint8Array(h.buffer),nb,data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
  central.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+data.length}
 const csize=central.reduce((a,b)=>a+b.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);
 return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"})}
const X=s=>String(s??"").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function wr(text,o={}){const pr=(o.b?"<w:b/><w:bCs/>":"")+(o.i?"<w:i/><w:iCs/>":"")+(o.caps?"<w:caps/>":"")+(o.color?`<w:color w:val="${o.color}"/>`:"")+(o.sz?`<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`:"");
 return `<w:r>${pr?`<w:rPr>${pr}</w:rPr>`:""}${String(text??"").split("\n").map((l,k)=>(k?"<w:br/>":"")+`<w:t xml:space="preserve">${X(l)}</w:t>`).join("")}</w:r>`}
function wp(runs,o={}){const pr=(o.style?`<w:pStyle w:val="${o.style}"/>`:"")+(o.keep?"<w:keepNext/>":"")+(o.after!=null||o.before!=null?`<w:spacing ${o.before!=null?`w:before="${o.before}" `:""}${o.after!=null?`w:after="${o.after}"`:""}/>`:"")+(o.ind?`<w:ind w:left="${o.ind}" w:hanging="${o.hang||0}"/>`:"")+(o.jc?`<w:jc w:val="${o.jc}"/>`:"");
 return `<w:p>${pr?`<w:pPr>${pr}</w:pPr>`:""}${Array.isArray(runs)?runs.join(""):(String(runs).startsWith("<w:r")?runs:wr(runs))}</w:p>`}
function wcell(content,w,o={}){const paras=(Array.isArray(content)?content:[content]).map(c=>typeof c==="string"&&c.startsWith("<w:p")?c:wp(wr(c===""||c==null?"—":c,{b:o.b,sz:o.sz}),{after:0})).join("")||wp("");
 return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${o.fill?`<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>`:""}</w:tcPr>${paras}</w:tc>`}
function wtable(widths,rows,o={}){const tot=widths.reduce((a,b)=>a+b,0);const bd=["top","left","bottom","right","insideH","insideV"].map(k=>`<w:${k} w:val="single" w:sz="4" w:space="0" w:color="9AA3AF"/>`).join("");
 const tr=rows.map((r,ri)=>{const head=o.header&&ri===0;return `<w:tr>${head?"<w:trPr><w:cantSplit/><w:tblHeader/></w:trPr>":"<w:trPr><w:cantSplit/></w:trPr>"}${r.map((c,ci)=>wcell(c,widths[ci],{b:head||(o.keyCol&&ci===0),fill:head?"DDF1F0":(o.keyCol&&ci===0?"F2F4F7":null),sz:head?20:(o.sz||null)})).join("")}</w:tr>`}).join("");
 return `<w:tbl><w:tblPr><w:tblW w:w="${tot}" w:type="dxa"/><w:tblBorders>${bd}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>${tr}</w:tbl>`+wp("",{after:60})}
function wtable130(W,h,t,fd,dash){const c1=2300,c2=2519,c3=2300,c4=W-c1-c2-c3;const bd=["top","left","bottom","right","insideH","insideV"].map(k=>`<w:${k} w:val="single" w:sz="4" w:space="0" w:color="9AA3AF"/>`).join("");
 const lab=(x,w)=>wcell(x,w,{b:true,fill:"F2F4F7",sz:22});
 const span=(x,w)=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/><w:gridSpan w:val="3"/></w:tcPr>${wp(wr(dash(x)),{after:0})}</w:tc>`;
 const full=(k,x)=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${lab(k,c1)}${span(x,c2+c3+c4)}</w:tr>`;
 const four=(k1,x1,k2,x2)=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${lab(k1,c1)}${wcell(dash(x1),c2)}${lab(k2,c3)}${wcell(dash(x2),c4)}</w:tr>`;
 return `<w:tbl><w:tblPr><w:tblW w:w="${W}" w:type="dxa"/><w:tblBorders>${bd}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid><w:gridCol w:w="${c1}"/><w:gridCol w:w="${c2}"/><w:gridCol w:w="${c3}"/><w:gridCol w:w="${c4}"/></w:tblGrid>`+
  full("Раздел / модуль",h.section)+full("ФИО педагога",h.teacher)+four("Дата",fd(h.date),"Группа / курс",h.group||t.audience)+four("Количество присутствующих",h.present,"Количество отсутствующих",h.absent)+full("Тема урока",t.topic)+full("Цели обучения в соответствии с учебной программой",h.objectives)+full("Цель урока",t.goal)+`</w:tbl>`+wp("",{after:60})}
function buildDocXml(){const l=L(),t=l.task,W=9638,dash=v=>v&&String(v).trim()?v:"—";
 const names=(ids,lib)=>ids.map(id=>lib[id].n).join(", ");
 const comps=l.comps.map(c=>CBY[c]).filter(Boolean);const syms=Object.keys(SYM).filter(k=>(l.trans||[]).includes(k)).map(s=>SYM[s].n);
 const H=txt=>wp(wr(txt),{style:"Heading2",keep:true});
 const kv=rows=>wtable([2700,W-2700],rows.map(([k,v])=>[k,dash(v)]),{keyCol:true});
 let b="";const h=l.head||{};const fd=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||"");return m?`${m[3]}.${m[2]}.${m[1]}`:(d||"")};
 b+=wp(wr("Краткосрочный (поурочный) план",{b:true,sz:28}),{jc:"center",after:160});
 const K=t=>({k:t});
 b+=wtable130(W,h,t,fd,dash);
 b+=wp(wr("Ход урока",{b:true}),{keep:true,before:120,after:80});
 if(l.timeline.length){let a=0;b+=wtable([1750,2300,2300,1550,W-7900],[["Этап урока / время","Действия педагога","Действия обучающихся","Оценивание","Ресурсы"],...l.timeline.map(r=>{const m=parseFloat(r.min)||0;const s=`${a}–${a+m} мин`;a+=m;return [[wp([wr(dash(r.stage),{b:true,sz:21}),wr("\n"+s,{sz:21})],{after:0})],r.teacher,r.students,r.assess,r.res]})],{header:true,sz:21});
  b+=wp([wr("Итого: ",{b:true}),wr(`${totalMin()} мин`+(t.duration?` (запланировано ${t.duration} мин)`:""))]);}
 else b+=wp("—");
 b+=`<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;
 b+=wp(wr("Приложение · инструмент Scaffold",{caps:true,color:"0C8A87",sz:18,b:true}),{after:40});
 b+=wp(wr("Проектирование занятия по методике Scaffold"),{style:"Title"});
 b+=H("Задание");
 b+=kv([["Длительность",t.duration?t.duration+" мин":""],["Целевая аудитория",t.audience],["Потребности",t.needs],["Место",t.place],["Связь с реальной жизнью",t.real]]);
 b+=H("1. Компетенции");
 if(comps.length){b+=wtable([900,2600,1300,W-4800],[["Код","Компетенция","Рамка","Подсказка для занятия"],...comps.map(c=>[c.code,c.name,FW[c.fw].s,c.hint])],{header:true,sz:21});
}
 else b+=wp("—");
 b+=wp([wr("Сквозные компетенции: ",{b:true}),wr(syms.length?syms.join(", "):"—")]);
 b+=H("2. Определение начального уровня");
 b+=kv([["Метод оценки",names(l.diag.methods,ABY)],["Как проводится",l.diag.note]]);
 b+=H("3. Метод обучения");
 const tm=l.teach.methods.map(id=>TBY[id]);
 b+=kv([["Метод(ы)",[names(l.teach.methods,TBY),l.teach.custom].filter(Boolean).join("; ")]]);
 tm.forEach(m=>{b+=wp(wr(m.n+" — шаги метода:",{b:true}),{after:40,keep:true});m.s.forEach((s,i)=>b+=wp(wr(`${i+1}. ${s}`),{after:20,ind:360,hang:0}));b+=wp("",{after:40})});
 b+=H("4. Ожидаемые результаты / индикаторы");
 const inds=l.results.indicators.filter(Boolean);
 b+=kv([["Конечный продукт",l.results.product],["Индикаторы",inds.map(i=>"• "+i).join("\n")],["Критерии оценивания",l.results.criteria]]);
 b+=H("5. Метод оценки");
 b+=kv([["Метод(ы)",names(l.assess.methods,ABY)],["Как проводится",l.assess.note]]);
 b+=H("6. Ресурсы");
 b+=kv([["Материалы и оборудование",l.res.items.length?l.res.items.map(r=>(r.done?"■ ":"□ ")+r.t).join("\n"):t.resources],["Люди",l.res.people]]);
 b+=wp(wr("Составлено в конструкторе урока Scaffold · "+new Date().toLocaleDateString("ru-RU"),{i:true,color:"6B7280",sz:18}),{before:240});
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${b}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`}
const DOCX_STYLES=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="Times New Roman" w:cs="Times New Roman"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="ru-RU" w:eastAsia="ru-RU" w:bidi="ar-SA"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="80" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style><w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:spacing w:after="200"/></w:pPr><w:rPr><w:b/><w:bCs/><w:color w:val="1A202B"/><w:sz w:val="34"/><w:szCs w:val="34"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:before="280" w:after="100"/><w:outlineLvl w:val="1"/></w:pPr><w:rPr><w:b/><w:bCs/><w:color w:val="0C8A87"/><w:sz w:val="27"/><w:szCs w:val="27"/></w:rPr></w:style></w:styles>`;
function downloadDocx(){try{
 const files=[
  ["[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`],
  ["_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`],
  ["docProps/core.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${X(lessonName(L()))}</dc:title><dc:creator>Конструктор урока Scaffold</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().slice(0,19)}Z</dcterms:created></cp:coreProperties>`],
  ["word/_rels/document.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
  ["word/styles.xml",DOCX_STYLES],

 ];
 const base=((L().task.topic||"").split(/[.\n]/)[0].trim()||"урок").replace(/[\\/:*?"<>|]+/g,"").slice(0,60).trim();
 downloadBlob(zip(files),`План_урока_${base.replace(/\s+/g,"_")}.docx`);toast("Документ Word скачан");
}catch(err){console.error(err);toast("Не удалось создать документ: "+err.message)}}
