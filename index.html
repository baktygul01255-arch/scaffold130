<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор урока Scaffold</title>
<style>
[hidden]{display:none!important}
body{margin:0}
/* Layout: left rail of 9 numbered Scaffold steps + working panel; the board view mirrors the physical card layout. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --surface-2:#F6F7F9; --ink:#1A202B; --muted:#5D6574; --line:#D8DCE3;
  --accent:#0C8A87; --accent-ink:#FFFFFF; --accent-soft:#DDF1F0;
  --sticky:#FFF4C2; --sticky-line:#E9D98A; --sticky-ink:#3B3416;
  --dig:#E8502C; --dig2:#F27A1F; --ent:#7E1B83; --ent2:#C3168F; --grn:#1EA772; --grn2:#4DBB4F; --life:#8DBB12; --life2:#B5D41C; --tr:#0FA2A6; --tr2:#2CBF86;
  --ok:#1F8A4C; --warn:#B26B00; --warn-soft:#FFF0D6; --danger:#B42318;
  --f-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --f-body:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --f-mono:Consolas,"Cascadia Mono",ui-monospace,Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161C; --surface:#1A1F27; --surface-2:#20262F; --ink:#E6E9EE; --muted:#9AA2B0; --line:#2E3540;
  --accent:#36C2BD; --accent-ink:#06201F; --accent-soft:#163533;
  --sticky:#3A3420; --sticky-line:#5A4F2A; --sticky-ink:#F3E9BE;
  --ok:#4CC27E; --warn:#F0A940; --warn-soft:#3A2C12; --danger:#F07167;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1A1F27; --surface-2:#20262F; --ink:#E6E9EE; --muted:#9AA2B0; --line:#2E3540;
  --accent:#36C2BD; --accent-ink:#06201F; --accent-soft:#163533;
  --sticky:#3A3420; --sticky-line:#5A4F2A; --sticky-ink:#F3E9BE;
  --ok:#4CC27E; --warn:#F0A940; --warn-soft:#3A2C12; --danger:#F07167;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.app{display:grid;grid-template-columns:260px minmax(0,1fr)}
/* top bar */
.top{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);z-index:20}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand-mark{display:grid;grid-template-columns:repeat(2,9px);gap:2px}
.brand-mark i{width:9px;height:9px;border-radius:2px;display:block}
.lesson-pick{display:flex;gap:8px;align-items:center;flex:1 1 320px;min-width:0;flex-wrap:wrap}
.lesson-pick select{flex:1 1 200px;min-width:0;max-width:420px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 9px;font-size:13px}
.save-state{font-size:12px;color:var(--muted)}
/* rail */
.rail{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;align-self:start}
.rail-h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:6px 10px 8px;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.step-btn{width:100%;text-align:left;display:grid;grid-template-columns:30px 1fr 12px;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;border:0;background:transparent;cursor:pointer}
.step-btn:hover{background:var(--surface-2)}
.step-btn.on{background:var(--accent-soft)}
.step-num{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--muted);background:var(--surface)}
.step-btn.on .step-num{border-color:var(--accent);color:var(--accent)}
.step-btn.done .step-num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step-t{font-size:14px;font-weight:600;line-height:1.25}
.step-s{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)}
.rail-foot{display:none;margin-top:14px;padding:12px 10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
/* main */
main{padding-block:24px 64px;padding-inline:28px;min-width:0}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,2.6vw,30px);line-height:1.15}
.lead{color:var(--muted);max-width:70ch;margin:0}
.pcard{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:760px}
.pcard .no{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--accent);line-height:1}
.pcard .lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pcard .q{font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:16px;font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:13.5px}
.note b{color:var(--warn)}
.nav-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:4px}
/* task cards with stickies */
.head-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tcard .tt{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.tcard .tq{font-weight:600;line-height:1.35}
.tcard .tn{font-size:12.5px;color:var(--muted)}
.sticky{width:100%;min-height:86px;resize:vertical;border:1px solid var(--sticky-line);background:var(--sticky);color:var(--sticky-ink);border-radius:4px;padding:10px 12px;line-height:1.45;box-shadow:0 2px 0 var(--sticky-line)}
.sticky::placeholder{color:var(--sticky-ink);opacity:.55}
.dur-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dur-row input{width:110px;padding:8px 10px;border:1px solid var(--sticky-line);background:var(--sticky);color:var(--sticky-ink);border-radius:4px;font-family:var(--f-mono)}
.chip-btn{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}
.chip-btn:hover{border-color:var(--accent)}
.chip-btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
.input,.area{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.area{min-height:80px;resize:vertical}
/* board */
.board{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.bcol{display:flex;flex-direction:column;gap:8px;min-width:150px}
.bhead{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.bhead:hover{border-color:var(--accent)}
.bhead .n{font-family:var(--f-display);font-weight:700;color:var(--accent);font-size:18px}
.bhead .t{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;line-height:1.25}
.bitem{font-size:12.5px;padding:7px 9px;border-radius:6px;background:var(--surface);border:1px solid var(--line);line-height:1.3}
.bitem.st{background:var(--sticky);border-color:var(--sticky-line);color:var(--sticky-ink)}
.bitem.empty{background:transparent;border-style:dashed;color:var(--muted)}
.bitem .code{font-family:var(--f-mono);font-weight:700;font-size:11px;margin-right:4px}
.tasks-strip{display:flex;flex-wrap:wrap;gap:8px}
.tasks-strip .bitem{max-width:260px}
/* competence library */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .input{max-width:260px}
.fw-chip{display:inline-flex;align-items:center;gap:6px}
.fw-chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sym-row{display:flex;flex-wrap:wrap;gap:6px}
.sym-btn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12.5px;color:var(--ink)}
.sym-btn svg{color:var(--tr)}
.sym-btn.on{border-color:var(--tr);background:var(--accent-soft)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:box-shadow .15s,border-color .15s}
.ccard.sel{border-color:var(--c1);box-shadow:0 0 0 2px var(--c1)}
.ccard.flash{animation:flash 1.2s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:none}}
.cband{background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff;padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-height:92px}
.cband.lite{color:#1C2A05}
.ctop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cname{font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;line-height:1.25}
.ccode{font-family:var(--f-mono);font-weight:700;font-size:13px;white-space:nowrap}
.cfw{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;font-weight:600}
.cbody{padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.cint{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.cint .lab{color:var(--muted);margin-right:2px}
.code-chip{font-family:var(--f-mono);font-size:11.5px;font-weight:700;padding:2px 6px;border-radius:5px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;color:var(--ink)}
.code-chip:hover{border-color:var(--accent)}
.code-chip.hit{background:var(--accent-soft);border-color:var(--accent)}
.csyms{display:flex;gap:4px;color:var(--tr)}
.cdesc{font-size:13.5px}
.chint{font-size:13px;font-style:italic;padding:8px 10px;border-radius:6px;background:var(--surface-2);border-left:3px solid var(--c1)}
.cfoot{padding:0 14px 14px}
.sel-btn{width:100%;justify-content:center}
.ccard.sel .sel-btn{background:var(--c1);border-color:var(--c1);color:#fff}
.ccard.sel.lite .sel-btn{color:#1C2A05}
.tray{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 8px;border-radius:7px;font-size:13px;color:#fff;background:linear-gradient(120deg,var(--c1),var(--c2));max-width:100%}
.tag.lite{color:#1C2A05}
.tag .code{font-family:var(--f-mono);font-weight:700;font-size:12px}
.tag button{border:0;background:rgba(0,0,0,.18);color:inherit;border-radius:5px;width:20px;height:20px;cursor:pointer;line-height:1;display:grid;place-items:center}
.reco{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.reco .code-chip .cnt{font-weight:500;color:var(--muted);margin-left:3px}
.trans-legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tl{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--muted)}
.tl svg{flex:none;color:var(--tr);margin-top:2px}
.tl b{color:var(--ink);display:block;font-size:13px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
/* method cards */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.mcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.mhead{padding:14px 16px 10px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.mhead .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mhead h3{font-size:15px;text-transform:uppercase;letter-spacing:.03em;line-height:1.3}
.mbody{padding:12px 16px;display:flex;flex-direction:column;gap:10px;font-size:13.5px;flex:1}
.mbody ol,.mbody ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.mfoot{padding:0 16px 14px;display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);letter-spacing:.03em}
/* lists */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.row .input{flex:1;min-width:0}
.check{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.check input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.check .input{background:transparent;border:0;padding:2px 0}
.check.done .input{text-decoration:line-through;color:var(--muted)}
.icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;width:28px;height:28px;border-radius:6px;flex:none}
.icon-btn:hover{color:var(--danger);background:var(--surface)}
/* timeline */
.tl-wrap{overflow-x:auto}
table.tline{width:100%;border-collapse:separate;border-spacing:0;min-width:1040px}
.tline th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:700}
.tline td{padding:6px 4px;vertical-align:top;border-bottom:1px solid var(--line)}
.tline textarea,.tline input{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px;resize:vertical;min-height:38px;line-height:1.4}
.tline textarea:hover,.tline input:hover,.tline textarea:focus,.tline input:focus{border-color:var(--line);background:var(--surface-2)}
.tline .min{font-family:var(--f-mono);font-variant-numeric:tabular-nums;width:64px}
.tline .clock{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:13px;font-variant-numeric:tabular-nums}
.tbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.tbar span{display:block;height:100%;border-right:1px solid var(--surface)}
.sum{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.pill{font-family:var(--f-mono);font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
/* plan doc */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:22px;max-width:900px}
.doc h2.dt{font-family:var(--f-display);font-size:22px;font-weight:700}
.doc h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700;margin-bottom:8px}
.kv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;white-space:pre-wrap}
.doc table{width:100%;border-collapse:collapse;font-size:13.5px}
.doc table.p130 th{width:22%;text-align:left;font-size:13px}
.appx{border-top:2px solid var(--line);padding-top:18px}
.doc th,.doc td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;white-space:pre-wrap}
.doc th{background:var(--surface-2);font-size:12px}
.doc .tbl{overflow-x:auto}
.empty-v{color:var(--muted);font-style:italic}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:var(--shadow)}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:20px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.modal textarea{min-height:180px;font-family:var(--f-mono);font-size:12px}
.example-flag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}
  .rail-h,.rail-foot{display:none}
  .steps{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .steps li{flex:none}
  .step-btn{grid-template-columns:26px auto;padding:6px 8px}
  .step-btn .dot{display:none}
  .step-num{width:26px;height:26px}
  .step-s{display:none}
  main{padding-inline:16px}
  .top{position:static;padding-inline:16px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{font-weight:600;color:var(--ink);margin-top:6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top-tools{display:flex;gap:8px;align-items:center;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 10px;font-weight:700;font-size:12.5px;letter-spacing:.04em;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.icon-tgl{width:34px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--ink)}
.ctitle{text-align:center;display:flex;flex-direction:column;gap:2px}
.ctitle .u{text-decoration:underline;text-underline-offset:3px;font-weight:600}
.ctitle .cap{font-size:12px;color:var(--muted);font-style:italic}
.ctitle h2{margin:10px 0 6px}
.rs{display:flex;flex-direction:column;gap:4px}
.rs textarea+textarea{border-top:1px dashed var(--line)!important}
.modal.help{max-width:760px;max-height:86vh;display:flex;flex-direction:column}
.help-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.help-head h2{font-family:var(--f-display);font-size:19px}
.help-body{overflow:auto;padding-right:6px;line-height:1.55;font-size:14.5px}
.help-body h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin:16px 0 6px}

["d.17","g.3","CT",["Защита окружающей среды","Понимание воздействия цифровых устройств, технологий и их использования на окружающую среду.","Определите воздействие цифровых технологий на окружающую среду."],["Қоршаған ортаны қорғау","Сандық құрылғылар мен технологиялардың және оларды пайдаланудың қоршаған ортаға әсерін түсіну.","Сандық технологияның қоршаған ортаға әсерін анықтаңыз."]],
["d.18","g.6","CT AN CR",["Решение технических проблем","Выявление технических проблем в устройствах и цифровых средах и их решение.","Выявите общие технические проблемы и создайте руководство по их решению."],["Техникалық мәселелерді шешу","Құрылғылар мен сандық ортадағы техникалық мәселелерді анықтау және оларды шешу.","Жалпы техникалық мәселелерді анықтаңыз және оларды шешуге арналған нұсқаулық әзірлеңіз."]],
["d.19","e.1 e.2 g.6 g.9","PS AN CR",["Определение потребностей и технологических решений","Использование и настройка цифровых инструментов и среды для удовлетворения выявленных потребностей и обеспечения доступности.","Выявите потребность и найдите или предложите цифровой инструмент для ее решения."],["Қажеттіліктер мен технологиялық шешімдерді анықтау","Анықталған қажеттіліктерді қанағаттандыру және қолжетімділікті қамтамасыз ету үшін сандық құралдар мен орталарды қолдану және орнату.","Қажеттілікті анықтаңыз және оны шешудің сандық құралын табыңыз немесе ұсыныңыз."]],
["d.20","e.1 e.2 g.6 g.9","PS AN CR",["Креативное использование цифровых технологий","Использование цифровых технологий для генерации знаний, инновационных процессов и продуктов. Понимание и решение проблем в цифровой среде.","Используйте цифровые технологии для выражения своих идей или создания ценностей."],["Цифрлық технологияларды креативті қолдану","Білім мен инновациялық процестерді және өнімдерді қалыптастыру үшін цифрлық технологияларды пайдалану. Сандық ортадағы мәселелерді түсіну және шешу.","Өз идеяларыңызды білдіру немесе құндылықтарды құру үшін сандық технологияны қолданыңыз."]],
["d.21","e.6 e.15 l.9","",["Выявление пробелов в цифровых компетенциях","Понимание и совершенствование собственной цифровой компетентности. Помощь другим в развитии их цифровой компетентности.","Оцените свою цифровую компетентность и составьте список возможностей для её улучшения."],["Цифрлық құзыреттердегі олқылықтарды анықтау","Өз цифрлық құзыреттілігін түсіну және жетілдіру. Басқаларға цифрлық құзыреттерін дамытуға көмектесу.","Цифрлық құзыреттеріңізді бағалаңыз және оны жақсарту мүмкіндіктерінің тізімін жасаңыз."]],
["e.1","d.1 d.11 d.19 d.20 g.4 g.5 g.6 g.10 l.8","CT PS AN",["Выявление возможностей","Анализ социальной, культурной и экономической ситуации с целью выявления потребностей/проблем и использования возможностей для создания ценности.","Выявите и опишите экологическую проблему, которую необходимо решить в вашем населенном пункте."],["Мүмкіндіктерді анықтау","Қажеттіліктер мен проблемаларды анықтау және құндылық құру мүмкіндіктерін пайдалану мақсатында әлеуметтік, мәдени және экономикалық жағдайды талдау.","Елді мекеніңізде шешілуі тиіс экологиялық мәселені анықтаңыз және сипаттаңыз."]],
["e.2","d.10 d.11 d.13 d.19 d.20 g.4 g.5 g.6 g.9","PS CR",["Креативность","Разработка творческих и целенаправленных идей для создания значимых результатов.","Найдите 50 способов применения карандаша."],["Шығармашылық","Құнды нәтижелер құру үшін шығармашылық және мақсатты идеяларды дамыту.","Қарындашты қолданудың 50 әдісін табыңыз."]],
["e.3","l.2 g.7 g.9 g.10","CR",["Видение","Представление будущего, чтобы направить усилия и воплотить идеи в реальность.","Создайте доску видения будущего на 20-летнюю перспективу."],["Болжау","Күш-жігерді бағыттау және идеяларды шындыққа айналдыру үшін болашақты елестету.","Болашағыңыздың 20 жылға арналған көзқарас тақтасын жасаңыз."]],
["e.4","d.12 g.5","CT",["Оценка идей","Признание социальной, культурной и экономической ценности идей и рассмотрение способов их распространения и/или защиты.","Проведите SWOT-анализ идеи или проекта."],["Идеяларды бағалау","Идеялардың әлеуметтік, мәдени және экономикалық құндылығын тану және оларды тарату және/немесе қорғау жолдарын қарастыру.","Идеяңыздың немесе жобаңыздың SWOT талдауын жасаңыз."]],
["e.5","g.1 g.2 g.3 g.4 l.3","CT",["Этическое и устойчивое мышление","Этичное поведение и устойчивое мышление, позволяющее оценивать последствия своих действий и считать себя ответственным за них.","Сравните три различных способа проведения отпуска и оцените их устойчивость."],["Этикалық және тұрақты ойлау","Этикалық мінез-құлық және тұрақты ойлау – сіздің әрекеттеріңіздің салдарын бағалауға және олар үшін өзіңізді жауапты деп санауға мүмкіндік береді.","Демалысыңызды өткізудің үш түрлі әдісін салыстырыңыз және олардың тұрақтылығын бағалаңыз."]],
["e.6","d.21 g.12 l.1 l.7","",["Самосознание и самоэффективность","Определение своих индивидуальных и групповых сильных и слабых сторон для укрепления веры в себя и формирования своего будущего в соответствии со своими потребностями, интересами и стремлениями.","Оцените свои навыки и разработайте план достижения краткосрочных, среднесрочных и долгосрочных целей."],["Өзін-өзі тану және өзіндік тиімділік","Өзіне деген сенімділікті нығайту және өзінің қажеттіліктеріне, қызығушылықтары мен ұмтылыстарына сәйкес болашағын қалыптастыру үшін өзінің жеке және топтық күшті және әлсіз жақтарын анықтау.","Дағдыларыңызды бағалаңыз, қысқа, орта және ұзақ мерзімді мақсаттарға жету жоспарын жасаңыз."]],
["e.7","l.1 l.7","",["Мотивация и упорство","Быть стойким, сохранять сосредоточенность и целеустремленность, не сдаваться, несмотря на невзгоды и временные неудачи.","Составьте список различных стратегий самомотивации и мотивации других людей по преодолению трудностей."],["Мотивация және табандылық","Табандылық, мақсаттылық, зейін мен адалдықты сақтау, қиындықтар мен уақытша сәтсіздіктерге қарамастан берілмеу.","Өзін-өзі ынталандырудың түрлі стратегияларының тізімін әзірлеңіз және басқалардың қиындықтарды жеңуін ынталандырыңыз."]],
["e.8","d.7","",["Мобилизация ресурсов","Получение поддержки и управление материальными и нематериальными ресурсами, максимальное использование своего времени.","Составьте список ресурсов, необходимых для проекта, и распределите роли."],["Ресурстарды жұмылдыру","Қолдау алу, материалдық және материалдық емес ресурстарды басқару, уақытты барынша тиімді пайдалану.","Жобаны орындау үшін қажетті ресурстардың тізімін жасаңыз және рөлдерді бөліңіз."]],
["e.9","g.1 g.2 g.3 l.3","",["Финансовая и экономическая грамотность","Понимание экономических и финансовых концепций для определения бюджета, поиска финансирования и создания устойчивой ценности.","Проанализируйте бизнес-модель известной компании."],["Қаржылық және экономикалық сауаттылық","Бюджетті анықтау, қаржыландыруды іздеу және тұрақты құндылық құру үшін экономикалық және қаржылық тұжырымдамаларды түсіну.","Танымал компанияның бизнес-моделіне талдау жасаңыз."]],
["e.10","l.5 g.11 g.10","CN",["Мобилизация других людей","Мотивация и убеждение соответствующих заинтересованных сторон для получения поддержки, эффективной коммуникации через различные средства массовой информации.","Подготовьте презентацию новой бизнес-идеи."],["Басқа адамдарды жұмылдыру","Әртүрлі бұқаралық ақпарат құралдары арқылы тиісті қолдау және тиімді байланыс алу үшін мүдделі тараптарды ынталандыру және сендіру.","Жаңа бизнес-идеяның презентациясын дайындаңыз."]],
["e.11","g.10 g.11 g.12","PS",["Проявление инициативы","Самостоятельная работа и действия по достижению целей, реализация намеченных планов и выполнение запланированных задач.","Определите первые шаги к достижению общих целей и помогайте другим людям."],["Бастамашылық таныту","Өз бетімен жұмыс істеу және мақсаттарға жету бойынша іс-әрекеттер, жоспарларды іске асыру және жоспарланған міндеттерді орындау.","Ортақ мақсаттарға жетудің алғашқы қадамдарын анықтаңыз және басқа адамдарға көмектесіңіз."]],
["e.12","d.3 d.14 g.7 g.8 l.2","CT",["Планирование и управление","Определение приоритетов и планов действий для достижения целей и адаптации к непредвиденным обстоятельствам.","Представьте себе худший сценарий решения проблемы и найдите оптимальные пути ее решения."],["Жоспарлау және басқару","Мақсаттарға жету және күтпеген жағдайларға бейімделу үшін іс-әрекеттің басымдықтары мен жоспарларын анықтау.","Мәселені шешудің ең нашар сценарийін елестетіп көріңіз және оны шешудің оңтайлы жолдарын табыңыз."]],
["e.13","g.8 l.2","",["Работа с неопределенностью, неоднозначностью и риском","Расчет и управление рисками, связанными с принимаемыми решениями, и готовность к изменению планов в зависимости от результата.","Используйте гибкий подход для решения поставленной задачи."],["Белгісіздікпен, түсініксіздікпен және тәуекелмен жұмыс істеу","Қабылданған шешімдерге байланысты тәуекелдерді есептеу және басқару, нәтижеге байланысты жоспарларды өзгертуге дайын болу.","Алға қойған міндеттерді орындау үшін икемді тәсілді қолданыңыз."]],
["e.14","d.4 d.5 d.7 g.11 l.4 l.6","TW",["Работа с другими людьми","Совместная работа и сотрудничество с другими людьми для разработки идей и воплощения их в реальность.","Проведите мозговой штурм идей и определите роли для реализации проекта."],["Басқа адамдармен жұмыс","Идеяларды әзірлеу және оларды шындыққа айналдыру үшін басқалармен бірлесіп ынтымақтастықта жұмыс істеу.","Миға шабуыл арқылы идеяларды ұсыныңыз және жобаны жүзеге асырудағы рөлдерді анықтаңыз."]],
["e.15","l.7 l.8 l.9 d.21","CT",["Обучение через опыт","Совместное обучение с коллегами и наставниками, рефлексия успехов и неудач, оценка накопленного опыта.","Проведите анализ проведенных мероприятий для создания чего-либо и выявите области для улучшения."],["Тәжірибе арқылы білім алу","Әріптестер және тәлімгерлермен бірлескен оқу, жетістік пен сәтсіздік рефлексиясы, жинақталған тәжірибені бағалау.","Қандай да бір нәрсе жасау үшін жүргізілген іс-шараларға талдау жасаңыз және жақсартуды қажет ететін тұстарды анықтаңыз."]],
["g.1","e.5 e.9 l.1 l.3 l.4","CT CN IC",["Оценка устойчивости","Рефлексия над личностными ценностями, их различием между людьми и во времени, а также их соответствие ценностям устойчивого развития.","Обсудите, может ли эгоистичный человек оценить «устойчивое мышление», где общество и планета ставятся выше интересов одного человека."],["Тұрақтылықты бағалау","Жеке құндылықтар рефлексиясы, олардың адамдар арасындағы және уақыт бойынша айырмашылықтары, сондай-ақ олардың тұрақтылық құндылықтарына сәйкестігі.","Қоғам мен планета бір адамның мүдделерінен жоғары тұрады деген тұрақты ойлауды өзімшіл адам бағалай ала ма, талқылаңыз."]],
["g.2","e.5 e.9 l.4","IC",["Поддержка справедливости","Поддержка равенства и справедливости для нынешнего и будущих поколений, извлечение уроков из прошлого.","Приведите примеры экологической несправедливости (например, превращение леса в поля под посев) и обсудите способы ее изменения."],["Әділеттілікті қолдау","Қазіргі және болашақ ұрпақ үшін теңдік пен әділеттілікті қолдау және өткеннен сабақ алу.","Экологиялық әділетсіздік жайлы мысалдар табыңыз (мысалы, орманды егістік алқаптарына айналдыру) және оны өзгерту жолдарын талқылаңыз."]],
["g.3","d.16 d.17 e.5 e.9 l.3 l.4","",["Охрана природы","Уважительное отношение к потребностям и правам других видов и природы для восстановления здоровых и устойчивых экосистем.","Посмотрите видеоролик об интенсивном животноводстве и обсудите вопрос о благополучии животных."],["Табиғатты қорғау","Салауатты және тұрақты экожүйелерді қалпына келтіру үшін басқа түрлердің және табиғаттың қажеттіліктері мен құқықтарына құрметпен қарау.","Қарқынды мал шаруашылығы туралы бейнероликті қараңыз және жануарлардың жағдайы мәселесін талқылаңыз."]],
["g.4","e.1 e.2 e.5 l.8","CT AN IC",["Системное мышление","Подход к проблеме устойчивого развития с учетом контекста для понимания, как элементы взаимодействуют в системах.","Выберите продукт питания из своей кладовой и проследите его жизненный цикл: происхождение, условия труда фермеров, воздействие климатических изменений, упаковку, срок годности, пищевую ценность."],["Жүйелі ойлау","Элементтердің жүйелерде қалай әрекеттесетінін түсіну үшін мәнмәтінді ескере отырып, тұрақты даму мәселесіне ықпал ету.","Қоймаңыздан азық-түлікті таңдаңыз және оның шығу тегін, фермерлердің еңбек жағдайларын, климаттық өзгерістердің ықтимал әсерін, қаптамасын, жарамдылық мерзімін, тағамдық құндылығын ескере отырып, өмірлік циклін қадағалаңыз."]],
["g.5","l.8 d.1 d.2 e.1 e.2 e.4","CT",["Критическое мышление","Оценка информации для выработки обоснованных выводов и инновационных решений в области защиты окружающей среды.","Обсудите решения спорных проблем в области окружающей среды."],["Сыни тұрғыдан ойлау","Қоршаған ортаны қорғау саласында негізделген қорытындылар мен инновациялық шешімдерді әзірлеу үшін ақпаратты бағалау.","Қоршаған орта саласындағы даулы мәселелердің шешімдерін талқылаңыз."]],
["g.6","d.13 d.18 d.19 d.20 e.1 e.2 l.8","PS",["Постановка проблемы","Рассмотрение вызовов как проблем устойчивого развития, учитывая сложность, участников, временные рамки и географический охват, а также определение соответствующих подходов.","Создайте альтернативные и безопасные маршруты передвижения для решения повседневных задач (например, маршрут в школу)."],["Мәселе тудыру","Қиындықты, қатысушыларды, уақыт шеңберін және географиялық ауқымды ескере отырып, сын-қатерді тұрақты даму мәселелері ретінде ұсыну және сәйкес тәсілдерді анықтау.","Күнделікті міндеттерді шешу үшін пайдаланушылардың баламалы және экологиялық негізделген қозғалыс маршруттарын жасаңыз (мысалы, мектепке баратын жол)."]],
["g.7","e.3 e.12","PS CR",["Грамотность в отношении будущего","Визуализация альтернативных вариантов устойчивого будущего и определение шагов по их достижению.","Разработайте модель мира в далеком будущем Земли."],["Болашақты болжау","Тұрақты болашақтың балама нұсқаларын елестету және оларға жету қадамдарын анықтау.","Жердің алыс болашағындағы әлем моделін жасаңыз."]],
["g.8","e.12 e.13 l.2","",["Адаптивность","Рассмотрение риска и неоднозначных ситуаций для управления переходными процессами в сложных обстоятельствах.","Дайте описание наихудшего экологического сценария и его влияния на жизнь."],["Бейімделу","Күрделі жағдайларда өтпелі кезеңдерді басқару үшін тәуекел мен даулы жағдайларды қарастыру.","Ең нашар экологиялық сценарий мен оның өмірге әсерін сипаттаңыз."]],
["g.9","d.13 d.19 d.20 e.2 e.3","CR",["Исследовательское мышление","Изучение и объединение различных дисциплин, использование творческого подхода и экспериментирование с новыми идеями или методами.","Разработайте три различных решения для одной экологической проблемы."],["Зерттеушілік ойлау","Әр түрлі пәндерді зерттеу және біріктіру, шығармашылық тәсілді қолдану және жаңа идеялармен немесе әдістермен тәжірибе жасау.","Бір экологиялық мәселенің үш түрлі шешімін қарастырыңыз."]],
["g.10","d.6 e.1 e.3 e.10 e.11 l.1","",["Политическая активность","Определение гражданской ответственности и подотчетности за неустойчивое поведение и требование проведения эффективной политики в области устойчивого развития.","Узнайте, кто отвечает за переработку отходов в вашем городе и как с ними связаться."],["Саяси белсенділік","Тұрақсыз мінез-құлық үшін саяси жауапкершілік пен есеп беруді анықтау және тұрақты дамуды қамтамасыз ету үшін тиімді саясатты талап ету.","Қалаңыздағы қалдықтарды қайта өңдеуге кім жауапты екенін және олармен қалай байланысуға болатынын анықтаңыз."]],
["g.11","d.4 d.6 d.7 e.10 e.11 e.14 l.6","TW",["Коллективные действия","Требование и достижение изменений в сотрудничестве с другими.","Подготовьте совместную речь для публичного выступления с просьбой о принятии рациональных мер."],["Ұжымдық әрекеттер","Басқалармен ынтымақтастықта өзгерістерді талап ету және оған қол жеткізу.","Көпшілік алдында ұтымды шаралар қабылдау туралы өтінішпен сөз сөйлеуге бірлесе дайындалыңыз."]],
["g.12","d.6 e.6 e.11 l.1","CN",["Индивидуальная инициатива","Определение собственного потенциала для устойчивого развития и активный вклад в улучшение общества и планеты.","Обдумайте и запишите повседневные практические действия, направленные на улучшение жизни вашего сообщества."],["Жеке бастама","Тұрақты дамудың өзіндік әлеуетін анықтау және қоғам мен планетаны жақсартуға белсенді үлес қосу.","Қоғамдастығыңыздың өмірін жақсартуға бағытталған күнделікті практикалық әрекеттерді қарастырыңыз және жазып алыңыз."]],

["l.3","d.9 d.15 d.16 e.5 e.9 g.1 g.3","",["Благополучие","Стремление к удовлетворенности жизнью, забота о физическом, психическом и социальном здоровье, ведение здорового образа жизни.","Создайте рекомендации по заботе о своем физическом, социальном и психологическом благополучии."],["Әл-ауқат","Өмірден қанағат алуға ұмтылу, физикалық, психикалық және әлеуметтік денсаулыққа қамқорлық жасау, салауатты өмір салтын ұстану.","Өзіңіздің физикалық, әлеуметтік және психологиялық әл-ауқатыңызға күтім жасау бойынша ұсыныстар әзірлеңіз."]],
["l.4","e.14 g.1 g.2 g.3","IC",["Эмпатия","Понимание эмоций, переживаний и ценностей другого человека и реагирование на них соответствующим образом.","Вступите в разговор с незнакомым человеком и выясните три факта (например, его лучший учитель, чем он гордится, что бы он сделал, если бы у него не было ограничений)."],["Эмпатия","Басқа адамның эмоциясын, күйзелісі мен құндылықтарын түсіну және оларға тиісінше жауап беру.","Бейтаныс адаммен сөйлесіп, үш фактіні анықтаңыз (мысалы, үздік мұғалімі, немен мақтанады, шектеулер болмаған жағдайда не істер еді)."]],
["l.5","d.4 d.8 e.10","CN IC",["Коммуникация","Использование стратегий коммуникации, кодов и инструментов, специфичных для данной области, в зависимости от контекста и содержания.","Практикуйте навык рассказывания историй."],["Байланыс","Мәнмәтін мен мазмұнға байланысты белгілі бір салаға тән байланыс стратегияларын, кодтарды және құралдарды пайдалану.","Сторителлингпен айналысыңыз немесе әңгімелеу дағдыларын үйреніңіз."]],
["l.6","d.4 d.7 d.8 e.14 g.11","TW CN",["Сотрудничество","Участие в совместной деятельности и командной работе, проявляя уважение к другим участникам.","Установите цели и правила для командной работы, поощряющие вклад всех участников."],["Ынтымақтастық","Басқаларға сыйластық танытып, топтық қызметке және командалық жұмысқа қатысу.","Барлық қатысушылардың қосқан үлесін ынталандыратын командалық жұмыстың мақсаттары мен ережелерін белгілеңіз."]],
["l.7","e.6 e.7 e.15","CT",["Мышление роста","Уверенность в собственном потенциале и в потенциале других людей для непрерывного обучения и развития.","Оцените свои ошибки как возможности для роста."],["Ой-өріс кеңдігі","Үздіксіз білім алу және даму үшін өз әлеуеті мен басқа адамдардың әлеуетіне сенімділік таныту.","Қателіктеріңізді өсу мүмкіндігі ретінде бағалаңыз."]],

function draftTimeline(){const l=L();
 const proceed=()=>{const dur=parseFloat(l.task.duration)||90;const m0=TBY[l.teach.methods[0]];const m=m0?M(m0):null;
  const diag=l.diag.methods.map(id=>M(ABY[id]).n).join(", ")||tr("dDiag");const asm=l.assess.methods.map(id=>M(ABY[id]).n).join(", ");
  const core=m?m.s:tr("dCore");
  const cs=l.comps.map(c=>CBY[c]).filter(Boolean);const hint=i=>cs.length?`${cs[i%cs.length].code}: ${cH(cs[i%cs.length])}`:"";
  const rows=[{stage:tr("dStart"),teacher:l.diag.note||tr("dStartT"),students:"",assess:diag,res:"",scaf:tr("dScafStart"),w:1.2}];
  core.forEach((s,i)=>rows.push({stage:m?`${m.n}: ${tr("dStep")(i+1)}`:s,teacher:"",students:m?s:"",assess:i===core.length-2?asm:"",res:"",scaf:hint(i),w:i===2||i===3?1.6:1.1}));
  rows.push({stage:tr("dEnd"),teacher:tr("dEndT"),students:tr("dEndS"),assess:asm||tr("dSelf"),res:"",scaf:tr("dScafEnd"),w:1});
  const W=rows.reduce((a,r)=>a+r.w,0);let left=dur;
  l.timeline=rows.map((r,i)=>{let mm=i===rows.length-1?left:Math.max(5,Math.round(dur*r.w/W/5)*5);left-=mm;const{w,...rest}=r;return{min:String(mm),...rest}});
  save();render();toast(tr("draftDone"))};
 if(l.timeline.length){confirmBox(tr("replaceQ"),tr("replace"),proceed)}else proceed()}

function confirmBox(msg,yes,fn){const bg=document.createElement("div");bg.className="modal-bg";bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div>${esc(msg)}</div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" data-x>${tr("cancel")}</button><button type="button" class="btn primary" data-y>${esc(yes)}</button></div></div>`;
 document.body.appendChild(bg);bg.querySelector("[data-y]").focus();bg.addEventListener("click",e=>{if(e.target.closest("[data-y]")){e.stopPropagation();bg.remove();fn()}else if(e.target.closest("[data-x]")||e.target===bg){e.stopPropagation();bg.remove()}})}

 try{if(rich&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([txt],{type:"text/plain"})})])}else{await navigator.clipboard.writeText(txt)}toast(tr("copied"))}
 catch(err){try{await navigator.clipboard.writeText(txt);toast(tr("copiedText"))}catch(e2){const r=document.createRange();r.selectNodeContents($("#doc"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast(tr("selected"))}}}

<h3>9 қадам</h3>
<ol>
<li><b>Тапсырма.</b> Жоспар нысанын таңдаңыз: «Оқу сабағының жоспары (колледж)» немесе «Қысқа мерзімді жоспар (№ 130 бұйрық)». Жоспардың басын толтырыңыз (ұйым, модуль, педагог, күні, топ) және 8 карточканың сұрақтарына жауап беріңіз: мақсаты, ұзақтығы, тақырыбы, аудитория, қажеттіліктер, ресурстар, өтетін орны, шынайы өмірмен байланысы.</li>
<li><b>Карточкаларды орналастыру.</b> Шолу: қатарға тізілген 7 жоспарлау карточкасы және олардың астына орналастырғанның бәрі. Толтыруға өту үшін карточканы басыңыз.</li>
<li><b>Құзыреттер.</b> 57 карточканың ішінен кемінде үшеуін таңдаңыз (DigComp, EntreComp, GreenComp, LifeComp). Шеңбер бойынша сүзгілер және атауы немесе коды бойынша іздеу көмектеседі (мысалы, <b>l.7</b> — латынның «l» әрпі). «Ықпалдастық» жолындағы және «Жақсы үйлеседі» блогындағы кодтар сәйкес карточкаларға апарады. <b>Сабақтың икемді құзыреттерін</b> белгілеңіз — жоспарға тек белгіленгендері шығады.</li>
<li><b>Бастапқы деңгей.</b> Диагностикаға арналған бағалау әдісін таңдап, оны қалай өткізетініңізді сипаттаңыз.</li>
<li><b>Оқыту әдісі.</b> 7 әдістің бірін немесе бірнешеуін таңдаңыз. Әдістің қадамдары хронологияны құрғанда керек болады.</li>
<li><b>Күтілетін нәтиже.</b> Соңғы өнімді, жетістік индикаторларын және бағалау критерийлерін сипаттаңыз.</li>
<li><b>Бағалау әдісі.</b> Сабақ барысында прогресті қалай бағалайтыныңызды таңдаңыз.</li>
<li><b>Ресурстар.</b> Бақылау тізімін жасап, дайын болғанын белгілеңіз. «Ресурстар» карточкасынан көшіру» батырмасы 1-қадамда жазғаныңызды қосады.</li>
<li><b>Сабақ жоспары.</b> Кезеңдерді толтырыңыз: минуттар, педагог пен студенттердің әрекеті. Колледж нысанында соңғы баған — <b>Scaffolding</b> (студенттер қандай қолдау алады). № 130 нысанында — <b>Ресурстар / Scaffold</b>. <b>«Әдіс қадамдары бойынша жоба»</b> батырмасы таңдалған әдіс бойынша кезеңдерді өзі толтырады, кейін оларды өңдеңіз. Минуттар қосындысы ұзақтығымен салыстырылады.</li>
</ol>

<h3>Дайын жоспар</h3>
<p>Соңғы экранда бүкіл сабақ бір құжатқа жиналған. Мұнда да жоспар нысанын ауыстыруға болады.</p>
<ul>
<li><b>«Word-қа жүктеу (.docx)»</b> — таңдалған тілдегі жоспар файлы. Батырма қосымшаның офлайн файлында бар.</li>
<li><b>«Жоспарды көшіру»</b> — нәтижені Word немесе Google Құжаттарға қойыңыз.</li>
<li>Қандай да бір қадам толтырылмаса, жоғарыда оған сілтемесі бар кеңес шығады.</li>
</ul>

<h3>Сақтау</h3>
<ul>
<li>Бәрі осы компьютердегі браузерде автоматты түрде сақталады. Интернет қажет емес.</li>
<li>Браузер деректерін тазаласаңыз немесе қосымшаны басқа компьютерде ашсаңыз, онда сабақтар болмайды. Сондықтан мезгіл-мезгіл <b>«Сақтық көшірме»</b> → «Файлға сақтау» жасаңыз. Сабақтарды қалпына келтіру үшін бұл файлды «Файлды ашу…» арқылы ашыңыз.</li>
<li>Өзіңіз жазған мәтіндер тіл ауыстырғанда аударылмайды. Тек жазулар, карточкалар және бөлім атаулары аударылады.</li>
</ul>

<h3>Кеңестер</h3>
<ul>
<li>Қадамдарды ретімен өту міндетті емес — сол жақтағы мәзір арқылы кез келгеніне оралыңыз.</li>
<li>Мақсатты SMART бойынша тұжырымдаңыз, ал Scaffolding-ті сабақтың соңына қарай қолдау біртіндеп азаятындай етіп жоспарлаңыз.</li>
<li>3-қадамдағы «Кездейсоқ карточка» батырмасы құзыреттердің ерекше үйлесімін табуға көмектеседі.</li>
</ul>`
};
function openHelp(){const bg=document.createElement("div");bg.className="modal-bg";
 bg.innerHTML=`<div class="modal help" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><div class="help-head"><h2 id="helpTitle">${tr("helpTitle")}</h2><button type="button" class="icon-btn" data-x aria-label="${esc(tr("close"))}">✕</button></div><div class="help-body">${HELP[LANG]}</div><div style="display:flex;justify-content:flex-end"><button type="button" class="btn primary" data-x>${tr("helpOk")}</button></div></div>`;
 document.body.appendChild(bg);bg.querySelector(".btn.primary").focus();
 const close=()=>{bg.remove();document.removeEventListener("keydown",onKey)};const onKey=e=>{if(e.key==="Escape")close()};document.addEventListener("keydown",onKey);
 bg.addEventListener("click",e=>{if(e.target===bg||e.target.closest("[data-x]")){e.stopPropagation();close()}});
 try{localStorage.setItem(KEY+"-helpSeen","1")}catch(e){}}

load();renderChrome();render();setSaved(storageOK?tr("savedInit"):tr("saveNA"));
try{if(!localStorage.getItem(KEY+"-helpSeen"))setTimeout(openHelp,300)}catch(e){}
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>renderChrome())}catch(e){}
</script>
